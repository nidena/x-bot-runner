name: Daily Post Report

on:
  schedule:
    # 毎日 21:00 JST = 12:00 UTC
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run daily report script
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONTENT_REPO_PAT: ${{ secrets.CONTENT_REPO_PAT }}
          CONTENT_REPO: nidena/x-bot-store
        run: npx ts-node src/daily-report.ts
