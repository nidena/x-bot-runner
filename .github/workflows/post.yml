name: Post to X

on:
  schedule:
    # 平日 08:10 JST = 23:10 UTC (前日 日〜木)  ※投稿予定 08:00 JST の+10分後
    - cron: "10 23 * * 0-4"
    # 平日 12:40 JST = 03:40 UTC (月〜金)  ※投稿予定 12:30 JST の+10分後
    - cron: "40 3 * * 1-5"
    # 平日 21:10 JST = 12:10 UTC (月〜金)  ※投稿予定 21:00 JST の+10分後
    - cron: "10 12 * * 1-5"
    # 土日 14:40 JST = 05:40 UTC (土〜日)  ※投稿予定 14:30 JST の+10分後
    - cron: "40 5 * * 0,6"
    # 土日 22:10 JST = 13:10 UTC (土〜日)  ※投稿予定 22:00 JST の+10分後
    - cron: "10 13 * * 0,6"
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run post script
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONTENT_REPO_PAT: ${{ secrets.CONTENT_REPO_PAT }}
          CONTENT_REPO: nidena/x-bot-store
        run: npx ts-node src/post.ts
