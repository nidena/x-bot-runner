name: Post to X

on:
  schedule:
    # 平日 08:10 JST = 23:10 UTC (前日 日〜木)
    - cron: "10 23 * * 0-4"
    # 平日 12:30 JST = 03:30 UTC (月〜金)
    - cron: "30 3 * * 1-5"
    # 平日 20:20 JST = 11:20 UTC (月〜金)
    - cron: "20 11 * * 1-5"
    # 土日 14:43 JST = 05:43 UTC (土〜日)
    - cron: "43 5 * * 0,6"
    # 土日 22:23 JST = 13:23 UTC (土〜日)
    - cron: "23 13 * * 0,6"
  workflow_dispatch:

concurrency:
  group: state-write
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Run post script
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_SECRET: ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          CONTENT_REPO_PAT: ${{ secrets.CONTENT_REPO_PAT }}
          CONTENT_REPO: nidena/x-bot-store
        run: npx ts-node src/post.ts
